version: "1.0"
purpose: "Shared, versioned reference knowledge for the agent-dev-skills toolkit; skills load entries by trigger instead of copying them."
loading:
  - "Read only entries whose triggers match a confirmed requirement or an unresolved architecture decision."
  - "External materials are linked and summarized; organization-specific conclusions belong in practices and rules."
  - "Large collections are split by concern; load the topic file named in the skill's references.md, not the whole collection. Navigation for all collections lives in knowledge/README.md."
entries:
  - id: design-conversation
    version: "1"
    title: "Progressive Agent design workflow"
    path: practices/agent-design-workflow.md
    level: L2
    authority: advisory
    triggers: ["new-agent", "requirements", "architecture", "technology-selection"]
    summary: "Clarify high-impact requirements one at a time before writing agent.design.md."
  - id: architecture-guardrails
    version: "1"
    title: "Architecture and security guardrails"
    path: rules/architecture-guardrails.md
    level: L3
    authority: enforced
    enforcedBy:
      - "skills/security-gates/SKILL.md#按触发条件的所需控制"
      - "skills/complexity-ladder/SKILL.md#每档真正够格的时机（standard §3）"
      - "skills/agent-design/SKILL.md#纪律"
    triggers: ["browser", "shell", "filesystem", "external-api", "credentials", "mcp", "database", "queue", "multi-agent", "rag", "durable-workflow"]
    summary: "Requirements that must remain explicit and are validated by deterministic project controls."
  - id: engineering-standard
    version: "1.0"
    title: "Agent engineering standard"
    path: standards/
    level: L2-L3
    authority: advisory
    triggers: ["security", "evaluation", "observability", "production", "governance"]
    summary: "Long-form engineering reference, split by concern under standards/ (01-foundations ... 10-references-and-evolution). Load only the relevant topic file, per each skill's references.md; collection map in knowledge/README.md."
  - id: technical-selection-guide
    version: "1"
    title: "Technical selection guide"
    path: selection/
    level: L0-reference
    authority: advisory
    triggers: ["technology-selection", "runtime", "framework", "harness"]
    summary: "External and public selection concepts, split under selection/ (01-selection-foundations ... 04-framework-comparison). Use for comparison, not as a mandatory rule source; collection map in knowledge/README.md."
  - id: development-lessons
    version: "1"
    title: "Agent development lessons"
    path: cases/
    level: L0-reference
    authority: advisory
    triggers: ["prompt", "context", "tools", "evaluation", "observability"]
    summary: "Source-linked cases, split by concern under cases/ (01-context-and-tools ... 06-sources-and-mapping); collection map in knowledge/README.md."
  - id: ai-native-dev-playbook
    version: "1"
    title: "AI-native development playbook (vibe coding)"
    path: practices/
    level: L2
    authority: advisory
    triggers: ["ai-assisted-dev", "coding-agent", "daily-development", "code-review", "project-harness"]
    summary: "How the team uses AI coding agents day-to-day, split under practices/ (01-mindset-and-collaboration ... 04-cost-and-rollout); collection map in knowledge/README.md."
